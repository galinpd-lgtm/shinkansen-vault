name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish smoke test (compressed single file starts)
        shell: pwsh
        run: |
          dotnet publish src/svault/svault.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -o smoke
          ./smoke/svault.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "{0:N1} MB" -f ((Get-Item smoke/svault.exe).Length / 1MB)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained svault.exe
        shell: pwsh
        run: |
          # Version comes from the tag: v0.1.1 -> 0.1.1
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/svault/svault.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:Version=$version -o publish
          $printed = ./publish/svault.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $printed
          $expected = "svault " + ($version -split '-')[0]
          if ($printed -ne $expected) { Write-Error "Expected '$expected', got '$printed'"; exit 1 }
          $hash = (Get-FileHash publish/svault.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  svault.exe" | Out-File -Encoding ascii publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" publish/svault.exe publish/SHA256SUMS.txt `
            --title "Shinkansen Vault ${{ github.ref_name }}" --notes "Self-contained win-x64 build. Verify with SHA256SUMS.txt. Build it yourself: see README."
